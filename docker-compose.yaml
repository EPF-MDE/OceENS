services:
  oceens:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ${LOCAL_DATABASE_DIR:-./database}:/app/database
      # Les CSV de seed vivent dans le paquet ; l'image est installée en mode
      # éditable, donc c'est bien ce chemin-là que lit le seed au démarrage.
      - ./src/oceens/seed_data:/app/src/oceens/seed_data
    restart: always
